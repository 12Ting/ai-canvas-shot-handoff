[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-canvas-core"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi[standard]>=0.139,<0.140",
  "pydantic>=2.13.4,<2.14",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "alembic>=1.18.5,<1.19",
  "Pillow>=12.2,<12.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9.1.1,<9.2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
